name: Secret probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe secrets
        run: |
          for name in TIEBAPURE_KEYSTORE_BASE64 TIEBAPURE_KEYSTORE_PASSWORD TIEBAPURE_KEY_ALIAS PROBE_TEST_VALUE; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name: SET (length=${#value})"
            else
              echo "$name: UNSET_OR_EMPTY"
            fi
          done
          echo "probe done"
